[project]
name = "integrator"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "sqlmodel>=0.0.22",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "alembic>=1.20.0",
    "requests>=2.32",
]

# installed in editable mode by 'uv sync', so that the numbered directories - which are not
# importable as packages themselves - can say 'from integrator_utils.python.db import ...'
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["integrator_utils"]
